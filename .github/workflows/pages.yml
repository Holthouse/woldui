# Deploys the docs and marketing site (site/) to GitHub Pages:
# https://holthouse.github.io/woldui
#
# Runs on every push to main, so the site always documents the code on main. It is
# independent of npm releases: the site renders the library from source, and a site-only
# change never needs a changeset.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push supersedes a queued one but never cancels a
# deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v6
      - run: pnpm --filter woldui-site build
      # Tells Pages not to run Jekyll, which would drop the _next/ folder.
      - run: touch site/out/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
