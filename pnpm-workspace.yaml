# Not a monorepo — this file only carries pnpm settings.
#
# pnpm 10 runs no dependency build scripts unless they are allowed here. esbuild (via Vite)
# and Tailwind's oxide engine need theirs; Playwright's browser download is left blocked
# and done explicitly (`pnpm exec playwright install chromium`).
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: false
  unrs-resolver: false
